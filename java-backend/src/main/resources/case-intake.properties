# ==============================================================================
# Meridian TradeFlow — Configurable Case Intake Role & Field Schema
# Modify attribute count, order, mandatory flags, types, options, or storage
# target (ICM vs CUSTOM_DB) here without modifying Java or UI source code.
# ==============================================================================

# Target Role & Initial Stage when a new Case is created inside IBM ICM
intake.initial.roleName=TF_LC_MAKER
intake.initial.inBasketId=lc-maker
intake.initial.stepName=LC Maker Draft & Verify
intake.initial.assignee=Priya Nair
intake.initial.caseType=TF_LC_Case
intake.wid.digits=6

# Document Classes selectable during Case Creation browse/upload
intake.document.classes=LC Application Form,Proforma Invoice,SWIFT Message,Sales Contract,KYC / Mandate,Bill of Lading Draft

# Ordered list of Intake Attribute Keys (add/remove keys freely here)
intake.fields.order=LC_Operation_Type,LC_Applicant_Name,LC_Beneficiary_Name,LC_SOL_ID,LC_Customer_ID

# 1. LC_Operation_Type (Mandatory)
intake.field.LC_Operation_Type.label=LC Operation Type
intake.field.LC_Operation_Type.type=select
intake.field.LC_Operation_Type.required=true
intake.field.LC_Operation_Type.source=ICM
intake.field.LC_Operation_Type.symbolicName=LC_Operation_Type
intake.field.LC_Operation_Type.options=Import LC Issuance,LC Amendment (MT707),Document Examination,Standby LC / BG
intake.field.LC_Operation_Type.placeholder=Select LC Operation Type

# 2. LC_Applicant_Name (Mandatory)
intake.field.LC_Applicant_Name.label=LC Applicant Name
intake.field.LC_Applicant_Name.type=string
intake.field.LC_Applicant_Name.required=true
intake.field.LC_Applicant_Name.source=ICM
intake.field.LC_Applicant_Name.symbolicName=LC_Applicant_Name
intake.field.LC_Applicant_Name.placeholder=Enter Applicant Corporate Name

# 3. LC_Beneficiary_Name (Optional)
intake.field.LC_Beneficiary_Name.label=LC Beneficiary Name
intake.field.LC_Beneficiary_Name.type=string
intake.field.LC_Beneficiary_Name.required=false
intake.field.LC_Beneficiary_Name.source=ICM
intake.field.LC_Beneficiary_Name.symbolicName=LC_Beneficiary_Name
intake.field.LC_Beneficiary_Name.placeholder=Enter Overseas Beneficiary Name

# 4. LC_SOL_ID (Mandatory String)
intake.field.LC_SOL_ID.label=LC SOL ID
intake.field.LC_SOL_ID.type=string
intake.field.LC_SOL_ID.required=true
intake.field.LC_SOL_ID.source=ICM
intake.field.LC_SOL_ID.symbolicName=LC_SOL_ID
intake.field.LC_SOL_ID.placeholder=e.g. 0041 or TF-MUM-01

# 5. LC_Customer_ID (Optional String)
intake.field.LC_Customer_ID.label=LC Customer ID
intake.field.LC_Customer_ID.type=string
intake.field.LC_Customer_ID.required=false
intake.field.LC_Customer_ID.source=CUSTOM_DB
intake.field.LC_Customer_ID.symbolicName=LC_Customer_ID
intake.field.LC_Customer_ID.dbColumn=lc_customer_id
intake.field.LC_Customer_ID.placeholder=e.g. CIF-88402910
