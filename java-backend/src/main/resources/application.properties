# ==============================================================================
# Meridian TradeFlow LC Case Manager — Application Configuration
# All IBM FileNet P8, IBM Case Manager (ICM), and MySQL Custom DB settings
# support environment variable overrides (${ENV_VAR:default}) for STS / Tomcat.
# ==============================================================================

server.port=${SERVER_PORT:8080}
spring.application.name=meridian-lc-casemanager-services

# ------------------------------------------------------------------------------
# 1. Custom Trade DB (MySQL + Hibernate JPA + HikariCP Pool)
# ------------------------------------------------------------------------------
spring.datasource.url=${CUSTOM_DB_URL:jdbc:mysql://localhost:3306/tradefinance_icm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${CUSTOM_DB_USER:tf_db_user}
spring.datasource.password=${CUSTOM_DB_PASSWORD:CHANGE_ME_DB_PASSWORD}

spring.datasource.hikari.pool-name=TradeFlowCustomDbPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CustomIntakeService Operational Configuration
customdb.schema-name=${CUSTOM_DB_SCHEMA:tradefinance_icm_db}
customdb.wid-digits=${CUSTOM_WID_DIGITS:6}
customdb.wid-prefix=${CUSTOM_WID_PREFIX:}
customdb.audit-enabled=true

# ------------------------------------------------------------------------------
# 2. IBM FileNet P8 Content Engine (CE) Configuration
# ------------------------------------------------------------------------------
filenet.url=${FILENET_URL:https://filenet-ce.bank.internal:9443/wsi/FNCEWS40MTOM/}
filenet.user=${FILENET_USER:p8service_user}
filenet.password=${FILENET_PASSWORD:CHANGE_ME_FILENET_PASSWORD}
filenet.stanza=${FILENET_STANZA:FileNetP8WSI}
filenet.domain=${FILENET_DOMAIN:P8_TF_DOMAIN}
filenet.target-object-store=${FILENET_TARGET_OS:TF_TARGET_OS}
filenet.design-object-store=${FILENET_DESIGN_OS:TF_DESIGN_OS}
filenet.case-folder-root=${FILENET_CASE_FOLDER_ROOT:/TradeFinanceLC/Cases}
filenet.default-document-class=${FILENET_DEFAULT_DOC_CLASS:TF_LC_Document}
filenet.connection-timeout-ms=30000

# ------------------------------------------------------------------------------
# 3. IBM Case Manager (ICM) / Business Automation Navigator Configuration
# Set icm.mode=LIVE_FILENET once Jace.jar / pe.jar / icm-case-api.jar are in libs/
# ------------------------------------------------------------------------------
icm.mode=${ICM_MODE:SIMULATED}
icm.url=${ICM_URL:https://icm-navigator.bank.internal:9443/navigator}
icm.rest-url=${ICM_REST_URL:https://icm-navigator.bank.internal:9443/CaseManager/CASEREST/v1}
icm.user=${ICM_USER:${FILENET_USER:p8service_user}}
icm.password=${ICM_PASSWORD:${FILENET_PASSWORD:CHANGE_ME_ICM_PASSWORD}}
icm.desktop-id=${ICM_DESKTOP_ID:TradeFinanceDesktop}
icm.connection-point=${ICM_CONNECTION_POINT:TF_PE_CP1}
icm.pe-region=${ICM_PE_REGION:1}
icm.solution-name=${ICM_SOLUTION_NAME:TradeFinanceLC}
icm.solution-prefix=${ICM_SOLUTION_PREFIX:TFLC}
icm.case-type=${ICM_CASE_TYPE:TFLC_ImportLCCase}
icm.viewer.daeja-base-url=${ICM_DAEJA_URL:https://icm-navigator.bank.internal:9443/navigator/bookmark.jsp}

# ------------------------------------------------------------------------------
# 4. Configurable Case Intake Roles & Fields Schema (.properties)
# Override with file:/opt/tradeflow/case-intake.properties for external updates
# ------------------------------------------------------------------------------
intake.config.path=${INTAKE_CONFIG_PATH:classpath:case-intake.properties}

# ------------------------------------------------------------------------------
# 5. Thymeleaf MVC & FileNet Multi-Document Upload Limits
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB
